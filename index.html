<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#FFF5E8">
  <meta name="description" content="ごはんをいっしょに食べる、見守りキャラクター「もぐとも」。カメラで顔を追い、ぱくっと食べたら応援するアプリ。">
  <title>もぐとも | いっしょに ぱくっ！</title>
  <style>
    :root { --ink:#49392F; --muted:#927C6D; --peach:#FF997C; --coral:#FA775D; --cream:#FFF5E8; --pink:#FFD5C8; --soft:#FFFEF9; --outline:#EBD7C7; }
    * {box-sizing:border-box}
    html { background:var(--cream); min-height:100%; }
    body { margin:0; color:var(--ink); font-family:ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button:focus-visible { outline:4px solid #5795ED; outline-offset:3px; }
    .app { width:min(100%,500px); margin:0 auto; min-height:100svh; padding:16px 20px max(22px,env(safe-area-inset-bottom)); position:relative; overflow:hidden; isolation:isolate; }
    .app:before { content:""; position:absolute; width:300px;height:300px;border-radius:50%;background:#FFE8D4;top:-140px;right:-160px;z-index:-1; }
    .topbar {display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;gap:12px}
    .brand {display:flex;align-items:center;gap:9px;font-weight:900;font-size:22px;letter-spacing:.03em}
    .logo {width:36px;height:36px;display:grid;place-items:center;background:#FFDD98;border:2px solid #F5C778;border-radius:12px;font-size:21px;transform:rotate(-8deg)}
    .icon-button {width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1.5px solid #EEDCCC;background:#FFF9F0;color:var(--ink);font-size:23px;box-shadow:0 3px 0 #F1E2D0}
    .icon-button[aria-pressed="false"] {opacity:.6}
    .sound-controls {display:flex;align-items:center;gap:6px;flex-shrink:0}
    .sound-controls .icon-button{width:40px;height:40px;font-size:20px}
    .camera-error{margin:12px 3px 0;padding:12px;border:1px solid #E3A190;background:#FFF9F3;border-radius:12px;color:#70483B;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
    .camera-error[hidden]{display:none}
    .audio-status{font-size:11px;color:#84665A;text-align:center;margin:10px 4px 0;line-height:1.5}
    .camera-error summary{font-weight:800;cursor:pointer}
    .camera-error code{font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap}
    .buddy.is-happy {animation:happyhop .95s cubic-bezier(.22,.9,.3,1) 1}
    .buddy.is-happy .arm.left {animation:waveleft .65s ease-in-out 2}
    .buddy.is-happy .arm.right {animation:waveright .65s ease-in-out 2}
    .buddy.is-happy .cheek {opacity:.72;transform:scale(1.12)}
    .buddy.is-happy .mouth {top:61%;height:22px;border:4px solid #8D424A;border-top:0;background:#FFF0F0;border-radius:0 0 40px 40px}
    .intro {text-align:center;margin:14px auto 0;}
    .eyebrow {color:#D27D64;font-size:12px;font-weight:900;letter-spacing:.12em;margin:0 0 3px;}
    h1 {font-size:clamp(25px,7vw,33px);letter-spacing:.02em;line-height:1.35;margin:0;font-weight:900}
    h1 .pink {color:#F07769}
    .subhead {font-size:13px;font-weight:700;color:var(--muted);margin:7px 0 0}
    .bubble {position:relative;z-index:2;max-width:340px;min-height:66px;margin:20px auto -4px;padding:15px 20px;background:white;border:2px solid #F1D8C8;border-radius:23px;box-shadow:0 6px 0 #F5E2D4;display:flex;align-items:center;justify-content:center;text-align:center;}
    .bubble:after {content:"";position:absolute;width:17px;height:17px;bottom:-10px;left:calc(50% - 9px);background:white;transform:rotate(45deg);border-right:2px solid #F1D8C8;border-bottom:2px solid #F1D8C8;}
    #saying {font-size:clamp(18px,5.1vw,22px);font-weight:900;line-height:1.35;margin:0;transition:opacity .2s}
    .stage {height:clamp(260px,38svh,355px);position:relative;display:flex;align-items:center;justify-content:center;margin:0 -20px;}
    .stage:before {content:"";position:absolute;left:6%;right:6%;height:64%;top:17%;border-radius:50%;background:#FFE8C9;filter:blur(2px);z-index:-1;}
    .decor {position:absolute;font-weight:900;color:#F9BE88;user-select:none;pointer-events:none}
    .decor.one {top:13%;left:7%;font-size:27px;transform:rotate(-20deg)}
    .decor.two {top:23%;right:9%;font-size:32px;color:#FBA7AD}
    .decor.three {bottom:27%;left:9%;font-size:21px;color:#EFBA82}
    .buddy {width:min(68vw,272px);height:min(68vw,272px);position:relative;transform:translateY(-2px);filter:drop-shadow(0 11px 0 rgba(195,125,91,.12));animation:breathe 3.4s ease-in-out infinite}
    @keyframes breathe {0%,100%{transform:translateY(3px) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
    .ear {position:absolute;top:-7%;width:31%;height:44%;background:#FFB0A1;border:4px solid #D98272;border-radius:54% 54% 42% 42%;z-index:0}
    .ear:before {content:"";position:absolute;inset:18% 22% 23%;background:#FFDBCF;border-radius:inherit}
    .ear.left {left:7%;transform:rotate(-26deg)}.ear.right {right:7%;transform:rotate(26deg)}
    .body {position:absolute;inset:9% 0 0;background:linear-gradient(150deg,#FFB8A6,#FF9287 80%);border:4px solid #D98272;border-radius:47% 47% 43% 43%;z-index:1;box-shadow:inset 13px -15px 0 rgba(235,97,87,.11),inset -14px 10px 0 rgba(255,255,255,.22)}
    .belly {position:absolute;left:22%;width:56%;height:35%;top:56%;background:#FFEEE2;border-radius:45%;z-index:1;opacity:.9}
    .eye {position:absolute;z-index:4;top:35%;width:17%;height:22%;background:#442F31;border-radius:48%;overflow:hidden;}
    .eye.left {left:25%}.eye.right {right:25%}
    .eye .shine {position:absolute;top:16%;left:22%;width:30%;height:24%;border-radius:50%;background:white}
    .eye .dot {position:absolute;bottom:19%;right:19%;width:13%;height:11%;border-radius:50%;background:#9C7D80}
    .eye-inner {position:absolute;inset:0;transform:translate(var(--look-x,0px),var(--look-y,0px));transition:transform .15s ease-out}
    .eye .eyelid {position:absolute;inset:-1px;background:#FFAF9D;border-radius:0 0 50% 50%;height:0;z-index:2;animation:blink 5.7s infinite}
    @keyframes blink {0%,92%,96%,100%{height:0}94%{height:100%}}
    .cheek {position:absolute;width:18%;height:9%;top:60%;background:#F56D6D;opacity:.48;border-radius:50%;z-index:3}
    .cheek.left {left:12%}.cheek.right {right:12%}
    .mouth {position:absolute;left:calc(50% - 18px);top:63%;width:36px;height:17px;border-bottom:5px solid #8D424A;border-radius:0 0 45px 45px;z-index:4;transition:all .2s}
    .buddy.is-munching .mouth {top:61%;left:calc(50% - 15px);width:30px;height:29px;background:#973B52;border:3px solid #8D424A;border-radius:50%;animation:chew .28s ease-in-out 4 alternate}
    @keyframes chew {from{transform:scaleY(1)}to{transform:scaleY(.45)}}
    .arm {position:absolute;top:64%;width:24%;height:13%;background:#FFA598;border:4px solid #D98272;border-radius:60%;z-index:3}
    .arm.left {left:-5%;transform:rotate(-28deg)}.arm.right {right:-5%;transform:rotate(28deg)}
    .buddy.is-munching .arm.right {transform:translate(-21px,-33px) rotate(-50deg);transition:transform .25s}
    .foot {position:absolute;bottom:1%;width:25%;height:14%;border-radius:50%;background:#F98C84;border:4px solid #D98272;z-index:2}
    .foot.left {left:12%;transform:rotate(-17deg)}.foot.right{right:12%;transform:rotate(17deg)}
    .food-emoji {position:absolute;z-index:5;bottom:4%;left:calc(50% + 20px);font-size:31px;opacity:0;pointer-events:none}
    .buddy.is-munching .food-emoji {animation:takebite 1s ease-out}
    @keyframes takebite {0%{opacity:0;transform:translate(25px,35px) scale(1)}18%{opacity:1}75%{opacity:1;transform:translate(-27px,-66px) scale(.8)}100%{opacity:0;transform:translate(-30px,-76px) scale(.2)}}
    @keyframes happyhop {0%{transform:translateY(2px) scale(1) rotate(-1deg)}20%{transform:translateY(-18px) scale(1.01) rotate(-3deg)}40%{transform:translateY(0) scale(.98) rotate(1deg)}65%{transform:translateY(-10px) scale(1.02) rotate(2deg)}100%{transform:translateY(3px) scale(1) rotate(-1deg)}}
    @keyframes waveleft {0%,100%{transform:rotate(-28deg)}50%{transform:translate(-3px,-8px) rotate(-52deg)}}
    @keyframes waveright {0%,100%{transform:rotate(28deg)}50%{transform:translate(3px,-10px) rotate(58deg)}}
    @keyframes shadowbounce {0%,100%{transform:scaleX(1);opacity:.6}25%{transform:scaleX(.9);opacity:.45}55%{transform:scaleX(1.08);opacity:.68}}
    .stage-shadow.happy {animation:shadowbounce .95s ease-out 1}
    .hearts {position:absolute;inset:0;pointer-events:none;z-index:21}
    .heart {position:absolute;left:50%;top:54%;font-size:26px;opacity:0;transform:translate(-50%,-50%) scale(.35)}
    .heart.pop {animation:heartburst 1.05s ease-out forwards}
    @keyframes heartburst {0%{opacity:0;transform:translate(var(--hx,0),var(--hy,0)) scale(.35)}18%{opacity:1}100%{opacity:0;transform:translate(calc(var(--hx,0) * 2.2),calc(var(--hy,0) - 58px)) scale(1.18)}}
    .stage-shadow {position:absolute;bottom:2%;left:25%;width:50%;height:17px;background:#EFC8B4;opacity:.6;border-radius:50%;filter:blur(6px)}
    .preview {position:absolute;bottom:8%;right:7%;z-index:8;width:88px;height:110px;border:3px solid white;border-radius:17px;background:#E5D8CF;box-shadow:0 3px 14px #754D3840;overflow:hidden;display:none}
    .preview.visible {display:block}
    .preview video {width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    .preview .live {position:absolute;top:7px;left:7px;font-size:9px;font-weight:900;color:white;background:#E65D67;padding:4px 6px;border-radius:7px}
    /* Live preview: video and annotation canvas use identical mirrored cover coordinates. */
    .preview {width:clamp(132px,36vw,160px);height:clamp(170px,46vw,205px);border-radius:18px;bottom:4%;right:4%;isolation:isolate;transition:width .2s,height .2s,transform .2s}
    .preview.expanded {width:min(78vw,258px);height:min(65svh,325px);box-shadow:0 7px 28px #4A2F3990;z-index:25}
    .preview .detection-canvas {position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none;z-index:2}
    .preview .preview-top{position:absolute;top:6px;left:6px;right:6px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:4px}
    .preview .live{position:static;font-size:9px;padding:4px 5px;background:#D84F5D}
    .preview .expand-preview {border:1px solid #ffffffb0;background:#332B2EB0;color:white;border-radius:7px;font-size:14px;min-width:28px;min-height:25px;line-height:1}
    .preview .detection-state {position:absolute;left:5px;right:5px;bottom:29px;z-index:5;border-radius:9px;background:#241D22D8;color:white;text-align:center;font-weight:900;font-size:11px;padding:6px 3px;text-shadow:0 1px 2px #111;line-height:1.3;pointer-events:none}
    .preview .detection-state[data-state="face"],.preview .detection-state[data-state="hand"]{background:#18654CCF}
    .preview .detection-state[data-state="near"]{background:#B36F1FE8}
    .preview .detection-state[data-state="bite"]{background:#E56B62EE}
    .preview .detection-state[data-state="error"]{background:#8E4D53DC}
    .preview .detection-chips{position:absolute;z-index:5;bottom:5px;left:5px;right:5px;display:flex;align-items:center;justify-content:center;gap:4px;pointer-events:none}
    .preview .detection-chips span{font-size:10px;flex:1;min-width:0;background:#322A31CB;color:#E7E2E2;text-align:center;border-radius:6px;font-weight:850;padding:4px 2px}
    .preview .detection-chips span.detected{background:#23855AE8;color:white}
    .preview .camera-bite-effect {position:absolute;inset:0;z-index:4;display:grid;place-items:center;opacity:0;pointer-events:none;background:radial-gradient(ellipse,#FFE28188,transparent 74%);transform:scale(.75)}
    .preview .camera-bite-effect.active {animation:cameraBiteFlash 1.25s ease-out forwards}
    .preview .camera-bite-effect .bite-label{background:#FFF9EDEE;color:#CC5E4B;padding:7px 8px;border-radius:999px;border:2px solid white;box-shadow:0 2px 12px #E96D67A0;font-size:clamp(13px,3.9vw,19px);font-weight:1000;white-space:nowrap;transform:rotate(-7deg)}
    .preview .camera-bite-effect .burst{position:absolute;font-size:28px;filter:drop-shadow(0 2px 3px #4B2B3970)}
    .preview .camera-bite-effect .burst.one{top:18%;left:14%;animation:burstOne 1.15s ease-out both}
    .preview .camera-bite-effect .burst.two{top:21%;right:8%;animation:burstTwo 1.15s ease-out both}
    .preview .camera-bite-effect .burst.three{bottom:22%;left:24%;animation:burstOne 1.15s ease-out both}
    @keyframes cameraBiteFlash{0%{opacity:0;transform:scale(.65)}16%{opacity:1;transform:scale(1.12)}32%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
    @keyframes burstOne{from{transform:translate(8px,20px) scale(.3) rotate(-20deg)}to{transform:translate(-15px,-25px) scale(1.15) rotate(18deg)}}
    @keyframes burstTwo{from{transform:translate(-7px,18px) scale(.3) rotate(22deg)}to{transform:translate(16px,-26px) scale(1.2) rotate(-20deg)}}
    .sparkle {position:absolute;z-index:20;pointer-events:none;font-size:25px;opacity:0;transform:translateY(10px)}
    .sparkle.active {animation:sparkup .85s ease-out forwards}
    @keyframes sparkup {0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-65px) scale(1.3)}}
    .status {display:flex;justify-content:center;margin:0 0 14px;position:relative;z-index:2}
    .status-pill {display:flex;align-items:center;gap:7px;background:#FFFDF7;padding:9px 14px;border:1px solid #EDDBD0;border-radius:999px;font-size:12px;font-weight:900;color:#876F61}
    .status-dot {height:8px;width:8px;background:#D4BAA5;border-radius:50%}
    .status-pill.found .status-dot {background:#61B58A;box-shadow:0 0 0 3px #D4F0DF}
    .status-pill.busy .status-dot {background:#EFAF5B;animation:pulse 1s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    .controls {display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:2}
    .action {min-height:91px;border-radius:24px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 #D8C7B9;transition:transform .13s,box-shadow .13s}
    .action:active {transform:translateY(4px);box-shadow:0 2px 0 #D8C7B9}
    .action.primary {background:var(--coral);color:white;box-shadow:0 6px 0 #D96A55}
    .action.secondary {background:#FFFDF8;color:#865A46;border:2px solid #F1DAC7;box-shadow:0 5px 0 #F2DDCE}
    .action .large {font-size:clamp(14px,4.2vw,18px);font-weight:1000;white-space:nowrap}
    .action .small {font-size:11px;font-weight:800;opacity:.8}
    .action .emoji {font-size:21px}
    .camera-row {display:flex;align-items:center;gap:11px;margin:18px 0 0;padding:13px 16px;background:#FFFDF8;border:1px solid #F1DFD0;border-radius:19px;box-shadow:0 4px 0 #F4E4D5;position:relative;z-index:2}
    .camera-symbol {width:36px;height:36px;flex-shrink:0;border-radius:13px;background:#FFE9D5;display:grid;place-items:center;font-size:20px}
    .camera-label {flex:1;min-width:0}.camera-label strong{font-size:13px;display:block}.camera-label span{font-size:11px;color:#9E8D80;display:block;line-height:1.45;margin-top:3px}
    .camera-btn {border:0;border-radius:999px;background:#74574C;color:white;padding:11px 14px;white-space:nowrap;font-size:12px;font-weight:900;min-width:95px}
    .camera-btn:disabled {opacity:.6}
    .bottom-meta {display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 3px 0;color:#998477;font-size:11px;font-weight:700}
    .toggle-line{display:flex;align-items:center;gap:7px;cursor:pointer}.toggle-line input{accent-color:#F27A69;width:18px;height:18px;cursor:pointer}
    .privacy {text-align:center;color:#A48E81;font-size:10px;line-height:1.6;padding:14px 2px 0;margin:0}
    .toast {position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(100px);width:max-content;max-width:calc(100vw - 40px);background:#51413B;color:white;border-radius:16px;padding:12px 17px;font-size:12px;z-index:30;opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;text-align:center}
    .toast.shown {transform:translateX(-50%) translateY(0);opacity:1}
    @media (max-height:740px) { .app{padding-top:10px}.intro{margin-top:6px}.bubble{margin-top:10px}.stage{height:clamp(230px,34svh,280px)}.status{margin-bottom:9px}.controls .action{min-height:75px}.camera-row{margin-top:12px}.bottom-meta{margin-top:13px}}
    @media (prefers-reduced-motion:reduce) {*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">🍙</span><span>もぐとも</span></div>
    <div class="sound-controls" role="group" aria-label="音の設定">
      <button id="voiceButton" type="button" class="icon-button" aria-label="鳴き声をオフにする" aria-pressed="true" title="鳴き声のオン・オフ">🔊</button>
      <button id="effectsButton" type="button" class="icon-button" aria-label="効果音をオフにする" aria-pressed="true" title="効果音のオン・オフ">🎵</button>
      <button id="testSoundButton" type="button" class="icon-button" aria-label="鳴き声と効果音を試す" title="音をためす">🔉</button>
    </div>
  </header>
  <section class="intro" aria-label="アプリのタイトル">
    <p class="eyebrow">ごはんの じかんが たのしくなる</p>
    <h1>いっしょに <span class="pink">ぱくっ！</span></h1>
    <p class="subhead">もぐちゃんと たのしく もぐもぐしよう</p>
  </section>
  <section aria-label="もぐちゃんのキャラクター">
    <div class="bubble" role="status" aria-live="polite"><p id="saying">いっしょに ごはん たべよ！</p></div>
    <div class="stage" id="stage">
      <span class="decor one" aria-hidden="true">✳</span><span class="decor two" aria-hidden="true">♥</span><span class="decor three" aria-hidden="true">✦</span>
      <div class="stage-shadow" aria-hidden="true"></div>
      <div id="buddy" class="buddy" aria-label="目を動かす、ピンク色のもぐちゃん" role="img">
        <div class="ear left"></div><div class="ear right"></div>
        <div class="foot left"></div><div class="foot right"></div>
        <div class="body"></div><div class="belly"></div>
        <div class="arm left"></div><div class="arm right"></div>
        <div class="eye left"><div class="eye-inner"><div class="shine"></div><div class="dot"></div></div><div class="eyelid"></div></div>
        <div class="eye right"><div class="eye-inner"><div class="shine"></div><div class="dot"></div></div><div class="eyelid"></div></div>
        <div class="cheek left"></div><div class="cheek right"></div>
        <div class="mouth"></div><div class="food-emoji" aria-hidden="true">🥕</div>
      </div>
      <div class="preview" id="preview" aria-label="ライブカメラの検出状態">
        <video id="video" playsinline autoplay muted aria-label="カメラのプレビュー"></video>
        <canvas id="detectionCanvas" class="detection-canvas" aria-hidden="true"></canvas>
        <div class="preview-top"><span class="live">● LIVE</span><button id="expandPreview" class="expand-preview" type="button" aria-label="カメラ映像を拡大" aria-pressed="false">⤢</button></div>
        <span id="detectionState" class="detection-state" data-state="search" role="status" aria-live="polite">👀 かおをさがすよ</span>
        <div class="detection-chips" aria-hidden="true"><span id="faceChip">顔 ・</span><span id="handChip">手 ・</span></div>
        <div id="cameraBiteEffect" class="camera-bite-effect" aria-hidden="true"><span class="burst one">✨</span><span class="burst two">🌟</span><span class="bite-label" id="cameraBiteLabel">ぱくっ！</span><span class="burst three">💛</span></div>
      </div>
      <div class="hearts" id="hearts" aria-hidden="true">
        <span class="heart" style="--hx:-58px;--hy:-6px">💖</span>
        <span class="heart" style="--hx:-18px;--hy:-30px">💕</span>
        <span class="heart" style="--hx:22px;--hy:-22px">✨</span>
        <span class="heart" style="--hx:58px;--hy:-2px">💛</span>
      </div>
      <span class="sparkle" style="left:12%;top:30%" aria-hidden="true">✨</span>
      <span class="sparkle" style="right:16%;top:15%" aria-hidden="true">⭐</span>
      <span class="sparkle" style="left:31%;bottom:14%" aria-hidden="true">💛</span>
      <span class="sparkle" style="right:20%;bottom:19%" aria-hidden="true">✨</span>
    </div>
  </section>
  <div class="status"><div id="statusPill" class="status-pill"><span class="status-dot"></span><span id="statusText">カメラをつけると めが あうよ 👀</span></div></div>
  <section class="controls" aria-label="ごはんの操作">
    <button id="eatTogether" class="action secondary" type="button"><span class="emoji" aria-hidden="true">🥄</span><span class="large">いっしょに ぱくっ</span><span class="small">もぐちゃんも たべるよ</span></button>

<script>

  const clamp = (v,min,max) => Math.min(max,Math.max(min,v));
  const distance = (a,b,w=1,h=1) => Math.hypot((a.x-b.x)*w,(a.y-b.y)*h);
  const praiseWords = ['ぱくっ！すてき！✨','おいしそう！よかったね！','もぐもぐ できたね！👏','たべたね！うれしいな！','いっしょに たべると おいしいね！'];
  const foods = ['🥕','🍙','🥦','🍓','🥔'];
  let soundOn = true, effectsOn = true, audioContext = null, stream = null, faceLandmarker = null, handLandmarker = null, starting = false;
  let requestId = 0, frameId = null, lastInference = 0, faceVisible = false, lastFaceTime = 0;
  let mealCount = 0, lastPraiseAt = -Infinity, lastInviteAt = performance.now(), lastActionAt = 0, munchTimeout=null, toastTimeout=null, happyTimeout=null;
  let waitingForHandToLeave = false, handEnteredAt = 0, handNearFrames = 0, mouthOpened = false;

  // Everything is synthesized on-device, without speech voices or audio downloads.
  // A user gesture unlocks audio on iPhone; retries also handle WebKit's interrupted state.
  async function activateAudio(){
    const Ctx=window.AudioContext||window.webkitAudioContext;

  function synthTone(from,to,offset,duration,volume,type='sine'){
    const ctx=audioContext;
    const at=ctx.currentTime+0.015+offset;
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(from,at);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1,to),at+duration*.8);
    gain.gain.setValueAtTime(.0001,at);
    gain.gain.exponentialRampToValueAtTime(volume,at+Math.min(.018,duration*.25));
    gain.gain.exponentialRampToValueAtTime(.0001,at+duration);

  }
  function scheduleSound(kind){
    // Friendly synthetic creature chirps; no OS Japanese TTS is used.
    switch(kind){
      case 'hello':
        synthTone(800,1250,0,.17,.17,'triangle');
        synthTone(1100,920,.21,.20,.13,'sine');
        break;
      case 'eatVoice':
        synthTone(760,970,0,.115,.15,'triangle');
        synthTone(1020,740,.14,.15,.12,'triangle');
        break;
      case 'happyVoice':
        synthTone(710,1030,0,.16,.16,'triangle');
        synthTone(920,1360,.18,.20,.16,'sine');
        synthTone(1280,1040,.40,.18,.12,'triangle');
        break;
      case 'munch':
        synthTone(430,230,0,.105,.14,'triangle');
        synthTone(315,210,.16,.085,.11);
        synthTone(280,190,.29,.085,.10);
        break;
      case 'praise':
        synthTone(523,610,0,.16,.11);
        synthTone(659,740,.13,.17,.12);
        synthTone(784,900,.27,.18,.12);
        synthTone(1047,1175,.41,.26,.14);

  // HTMLAudioElement plays through the media audio path on iPhone.
  // Safari sometimes silently mutes a running Web Audio context. Keep Web Audio as a fallback.
  const mediaPlayers = {};
  const mediaClips = {};
  function setAudioStatus(message){ $('audioStatus').textContent=message; }
  function createSoundClip(kind){
    if(mediaClips[kind])return mediaClips[kind];
    if(typeof Blob==='undefined'||typeof URL==='undefined'||!URL.createObjectURL)throw Error('WAV Blob URL unavailable');
    const notes={
      hello:[[0,.17,800,1250,.53,'triangle'],[.21,.2,1100,920,.45,'sine']],
      eatVoice:[[0,.115,760,970,.55,'triangle'],[.14,.15,1020,740,.45,'triangle']],
      happyVoice:[[0,.16,710,1030,.5,'triangle'],[.18,.2,920,1360,.52,'sine'],[.4,.18,1280,1040,.38,'triangle']],
      munch:[[0,.12,430,230,.52,'triangle'],[.17,.10,315,210,.43,'sine'],[.30,.09,280,190,.40,'sine']],
      praise:[[0,.16,523,610,.45,'sine'],[.13,.18,659,740,.46,'sine'],[.27,.18,784,900,.46,'sine'],[.41,.27,1047,1175,.50,'sine']],
      enabled:[[0,.15,660,910,.62,'triangle']]
    }[kind]||[[0,.15,650,850,.5,'sine']];
    const rate=22050;
    const seconds=Math.max(...notes.map(n=>n[0]+n[1]))+.08;
    const count=Math.ceil(rate*seconds);
    const samples=new Float32Array(count);
    for(const [offset,duration,startHz,endHz,amplitude,wave] of notes){
      let phase=0;
      const startIndex=Math.floor(offset*rate);
      const length=Math.floor(duration*rate);
      for(let i=0;i<length&&startIndex+i<count;i++){
        const progress=i/Math.max(length-1,1);
        const hz=startHz*Math.pow(endHz/startHz,progress);
        phase+=2*Math.PI*hz/rate;
        const signal=wave==='triangle'?2*Math.asin(Math.sin(phase))/Math.PI:Math.sin(phase);
        const attack=Math.min(1,i/(rate*.012));
        const release=Math.min(1,(length-i)/(rate*.045));
        samples[startIndex+i]+=signal*amplitude*attack*release;
      }
    }
    const data=new ArrayBuffer(44+count*2), view=new DataView(data);
    const tag=(i,t)=>{for(let j=0;j<t.length;j++)view.setUint8(i+j,t.charCodeAt(j));};
    tag(0,'RIFF');view.setUint32(4,36+count*2,true);tag(8,'WAVE');tag(12,'fmt ');
    view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
    view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);
    view.setUint16(32,2,true);view.setUint16(34,16,true);
    tag(36,'data');view.setUint32(40,count*2,true);

      const sample=Math.max(-.9,Math.min(.9,samples[i]));
      view.setInt16(44+i*2,Math.round(sample*32767),true);
    }
    mediaClips[kind]=URL.createObjectURL(new Blob([data],{type:'audio/wav'}));
    return mediaClips[kind];
  }
  async function tryWebAudioFallback(kind,error){
    console.warn('HTML audio unavailable; trying Web Audio',error);
    const ready=await activateAudio();
    if(!ready){setAudioStatus('音の再生がブロックされました。Safariで直接開き、音量を確認してください。');return;}
    try{
      scheduleSound(kind);
      setAudioStatus('Web Audioで再生を試みました。聞こえなければ消音モードを確認してください。');
    }catch(e){
      console.warn('Audio fallback error',e);
      setAudioStatus('音の再生に失敗: '+(e?.name||'Error'));
    }
  }
  function playSound(kind,channel){
    if(channel==='voice'&&!soundOn||channel==='effects'&&!effectsOn||document.hidden)return;

    // Waiting for AudioContext.resume() first can lose user activation in Safari.
    try{
      if(!document.createElement)throw Error('HTMLAudioElement unsupported');

      if(!player){

        player.preload='auto';
        player.setAttribute('playsinline','');
        player.style.display='none';
        document.body.appendChild(player);
        mediaPlayers[channel]=player;
      }
      player.pause();
      player.src=createSoundClip(kind);
      player.volume=1;
      setAudioStatus('🔉 音を再生中。聞こえないときは音量と消音モードを確認してね。');
      const result=player.play();
      if(result&&typeof result.catch==='function'){

          if(e?.name==='AbortError')return;
          void tryWebAudioFallback(kind,e);

      }

  }
  function playEffect(kind){void playSound(kind,'effects');}
  // Pointerdown unlock makes the first actual button tap work on Safari too.
  document.addEventListener('pointerdown',()=>{if(soundOn||effectsOn)void activateAudio();},{passive:true});
  document.addEventListener('touchstart',()=>{if(soundOn||effectsOn)void activateAudio();},{passive:true});
  document.addEventListener('keydown',()=>{if(soundOn||effectsOn)void activateAudio();});

    void playSound(kind,'voice');
  }
  function say(text, speak=true){ saying.textContent=text; if(speak) talk(text); }
  function burstHearts(){
    hearts?.querySelectorAll('.heart').forEach((el,i)=>{

  function celebrate(){
    if (happyTimeout) clearTimeout(happyTimeout);

    buddy.classList.add('is-happy');

      buddy.classList.remove('is-happy');
      stage?.querySelector('.stage-shadow')?.classList.remove('happy');

  }
  function showToast(message){
    toast.textContent=message; toast.classList.add('shown'); clearTimeout(toastTimeout);
    toastTimeout=setTimeout(()=>toast.classList.remove('shown'),3600);
  }
  function status(label,state=''){
    statusText.textContent=label; statusPill.className='status-pill'+(state?' '+state:'');
  }
  function look(x=0,y=0){
    const width=buddy.getBoundingClientRect().width || 260;
    buddy.style.setProperty('--look-x',`${(x*width*.039).toFixed(1)}px`);

  }

  const detectionNames={
    loading:'⏳ AIじゅんび中',search:'👀 かおをさがすよ',
    face:'😊 かおを検出',hand:'🖐️ てを検出',
    near:'🥄 おくちに近づいた！',bite:'✨ ぱくっ！',
    error:'⚠️ AIはおやすみ'
  };
  function detectionStatus(next,face=false,hand=false){
    // A bite celebration stays visible even if subsequent frames only see the face.
    if(next!=='bite'&&performance.now()<cameraBiteUntil)return;
    if(detectionState.dataset.state!==next){
      detectionState.dataset.state=next;
      detectionState.textContent=detectionNames[next]||detectionNames.search;
    }
    faceChip.classList.toggle('detected',!!face);
    handChip.classList.toggle('detected',!!hand);
    faceChip.textContent=face?'顔 ✓':'顔 ・';
    handChip.textContent=hand?'手 ✓':'手 ・';
  }
  function clearDetectionCanvas(){
    const ctx=detectionCanvas.getContext?.('2d');
    if(ctx)ctx.clearRect(0,0,detectionCanvas.width,detectionCanvas.height);
  }
  function resetDetection(){
    cameraBiteUntil=0;
    if(cameraBiteTimeout)clearTimeout(cameraBiteTimeout);
    cameraBiteTimeout=null;
    cameraBiteEffect.classList.remove('active');
    detectionStatus('search');
    clearDetectionCanvas();
  }
  function cameraBiteBurst(source){
    if(!stream||!preview.classList.contains('visible'))return;
    cameraBiteUntil=performance.now()+1400;
    detectionStatus('bite',true,source==='auto');
    $('cameraBiteLabel').textContent=source==='auto'?'ぱくっ！✨':'やったね！✨';
    cameraBiteEffect.classList.remove('active');
    void cameraBiteEffect.offsetWidth;
    cameraBiteEffect.classList.add('active');
    if(cameraBiteTimeout)clearTimeout(cameraBiteTimeout);
    cameraBiteTimeout=setTimeout(()=>{
      cameraBiteEffect.classList.remove('active');
      cameraBiteUntil=0;
    },1450);
  }
  function drawDetection(face,hands,near){
    const ctx=detectionCanvas.getContext?.('2d');
    if(!ctx)return;
    const cw=detectionCanvas.clientWidth, ch=detectionCanvas.clientHeight;
    if(!cw||!ch)return;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const bw=Math.round(cw*dpr),bh=Math.round(ch*dpr);
    if(detectionCanvas.width!==bw||detectionCanvas.height!==bh){
      detectionCanvas.width=bw; detectionCanvas.height=bh;
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cw,ch);
    if(!face)return;
    const vw=video.videoWidth||640,vh=video.videoHeight||480;
    const scale=Math.max(cw/vw,ch/vh), dx=(cw-vw*scale)*.5,dy=(ch-vh*scale)*.5;
    const project=p=>({x:p.x*vw*scale+dx,y:p.y*vh*scale+dy});
    const mouth=project({x:(face[13].x+face[14].x)*.5,y:(face[13].y+face[14].y)*.5});
    const upper=project(face[10]),chin=project(face[152]),left=project(face[234]),right=project(face[454]);
    const x=(left.x+right.x)*.5,y=(upper.y+chin.y)*.5;
    const rx=Math.abs(right.x-left.x)*.57,ry=Math.abs(chin.y-upper.y)*.55;
    ctx.strokeStyle='#72FFD0';ctx.lineWidth=2.3;
    ctx.setLineDash([5,3]);ctx.beginPath();ctx.ellipse(x,y,Math.max(8,rx),Math.max(10,ry),0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    // Mark the mouth and the visible fingertips, not all 478 landmarks.
    ctx.fillStyle=near?'#FFC86C':'#EFFFF8';
    ctx.strokeStyle=near?'#FFCF6C':'#21AD78';
    ctx.lineWidth=2.1;ctx.beginPath();ctx.arc(mouth.x,mouth.y,near?7:4.5,0,Math.PI*2);ctx.fill();ctx.stroke();
    for(const hand of hands||[]){
      const fingertips=[4,8,12,16,20].filter(i=>hand[i]);
      for(const i of fingertips){
        const point=project(hand[i]);
        if(point.x<0||point.x>cw||point.y<0||point.y>ch)continue;
        ctx.fillStyle=near?'#FFCA61':'#81DDFB';
        ctx.beginPath();ctx.arc(point.x,point.y,2.8,0,Math.PI*2);ctx.fill();
      }
    }
  }

  function munch(withSpeech=true){
    if (munchTimeout) clearTimeout(munchTimeout);
    buddy.classList.remove('is-munching'); void buddy.offsetWidth;
    buddy.querySelector('.food-emoji').textContent=foods[Math.floor(Math.random()*foods.length)];
    buddy.classList.add('is-munching');
    munchTimeout=setTimeout(()=>buddy.classList.remove('is-munching'),1280);
    lastInviteAt=performance.now(); lastActionAt=lastInviteAt;
    playEffect('munch');
    say('ぼくも ぱくっ！おいしい〜！',withSpeech);
  }
  function sparkle(){
    document.querySelectorAll('.sparkle').forEach((el,i)=>{
      el.classList.remove('active'); void el.offsetWidth;
      setTimeout(()=>el.classList.add('active'),i*110);
    });
  }
  function praise(source){
    const now=performance.now();
    if(source==='auto' && (now-lastPraiseAt < 8500 || !$('autoPraise').checked)) return;
    mealCount++; $('biteCount').textContent=`🌟 ぱくっ ${mealCount}かい`;
    lastPraiseAt=now; lastActionAt=now; lastInviteAt=now;
    waitingForHandToLeave=false; handNearFrames=0; mouthOpened=false;
    celebrate();
    sparkle();
    cameraBiteBurst(source);
    playEffect('praise');
    say(praiseWords[(mealCount-1)%praiseWords.length]);
    if(navigator.vibrate && source==='manual') navigator.vibrate(30);
  }
  function resetGesture(){waitingForHandToLeave=false;handEnteredAt=0;handNearFrames=0;mouthOpened=false;}

  function isLikelyBite(duration){
    if(duration>=4200)return false;
    // Brief contact requires visible mouth opening; slower contact may be a spoon bite.
    return mouthOpened ? handNearFrames>=2 && duration>=300 : handNearFrames>=3 && duration>=550;
  }
  function observeBite(face,hands,now){
    if (!$('autoPraise').checked || !hands?.length) {
      if(waitingForHandToLeave && now-handEnteredAt>6000) resetGesture();
      // When the hand disappears after visiting the mouth, this is a valid withdrawal.
      if(!hands?.length && waitingForHandToLeave && isLikelyBite(now-handEnteredAt)){praise('auto');resetGesture();}
      return;
    }
    const mouth={x:(face[13].x+face[14].x)/2,y:(face[13].y+face[14].y)/2};
    const left=face[234],right=face[454],top=face[13],bottom=face[14];
    const w=video.videoWidth||640, h=video.videoHeight||480;
    const faceW=distance(left,right,w,h);
    if (faceW < w*.095) {resetGesture();return;}
    const mouthW=distance(face[61],face[291],w,h);
    const openness=distance(top,bottom,w,h)/Math.max(mouthW,1);
    let near=false;
    for(const hand of hands){
      // A fingertip approaching the lips and then moving away is a *bite candidate*.
      for(const point of [4,8,12,16,20]){
        if(distance(hand[point],mouth,w,h)<faceW*.35){near=true;break;}
      }
      if(near) break;
    }
    if(near){
      if(!waitingForHandToLeave){ waitingForHandToLeave=true;handEnteredAt=now;handNearFrames=0;mouthOpened=false; }
      handNearFrames++;
      if(openness>.105) mouthOpened=true;
    } else if(waitingForHandToLeave){
      const duration=now-handEnteredAt;
      // Avoid praising on a one-frame hand detection glitch.
      if(isLikelyBite(duration)){praise('auto');}
      resetGesture();
    }
    if(waitingForHandToLeave && now-handEnteredAt>4200) resetGesture();
  }

  async function createTask(Task,vision,options){
    // Older iOS Safari WebGL implementations can fail to create GPU delegates.
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const order=ios?['CPU','GPU']:['GPU','CPU'];
    let lastError;
    for(const delegate of order){
      try{return await Task.createFromOptions(vision,{...options,baseOptions:{...options.baseOptions,delegate}});}
      catch(e){lastError=e;console.warn('MediaPipe '+delegate+' initialization failed',e);}
    }
    throw lastError||new Error('MediaPipe initialization failed');
  }
  async function loadVisionLibrary(){
    try{return await import(`${CDN}/vision_bundle.mjs`);}
    catch(primary){
      console.warn('Primary MediaPipe CDN unavailable',primary);
      return await import('https://esm.sh/@mediapipe/tasks-vision@0.10.22-rc.20250304?bundle');
    }
  }
  function cameraExplanation(error){
    const name=error?.name||'UnknownError';
    switch(name){
      case 'NotAllowedError':case 'PermissionDeniedError':
        return 'カメラの許可がありません。iPhoneの設定 → Safari → カメラを確認してね。';
      case 'NotFoundError':case 'DevicesNotFoundError':
        return '使えるカメラが見つかりませんでした。';
      case 'NotReadableError':case 'TrackStartError':
        return 'カメラがほかのアプリで使用中の可能性があります。';
      case 'OverconstrainedError':
        return 'カメラの設定が合いません。ほかのカメラ設定で再試行してね。';
      case 'SecurityError':
        return 'ブラウザ側でカメラが制限されています。Safariで直接開いてください。';
      default:
        return 'カメラが起動できません。Safariで直接開き、エラー詳細を確認してください。';
    }
  }
  function showCameraIssue(phase,error){
    console.error(phase,error);
    cameraError.hidden=false;
    cameraError.open=false;
    const name=error?.name||'Error',message=error?.message||String(error||'詳細不明');
    cameraErrorText.textContent=`${phase}\n${name}: ${message}\nブラウザ: ${navigator.userAgent}`;
  }
  function stopCamera(showMessage=true){
    requestId++;
    if(frameId!==null){cancelAnimationFrame(frameId);frameId=null;}
    if(stream){stream.getTracks().forEach(track=>track.stop());stream=null;}
    resetDetection();
    video.pause(); video.srcObject=null; preview.classList.remove('visible');
    cameraButton.textContent='カメラ ON'; cameraButton.disabled=false;
    $('cameraDescription').textContent='おかおと おくちへのてのうごきを みるよ';
    faceVisible=false;lastFaceTime=0;resetGesture();look();starting=false;
    buddy.classList.remove('is-happy'); stage?.querySelector('.stage-shadow')?.classList.remove('happy');
    status('カメラをつけると めが あうよ 👀');
    if(showMessage) say('また いっしょに たべようね！',false);
  }
  function loop(runId){
    if (runId!==requestId || !stream) return;
    const now=performance.now();
    if (video.readyState>=2 && now-lastInference>125){
      lastInference=now;
      try {
        const start=performance.now();
        // detectForVideo is synchronous; throttle for mobile battery/heat.
        const faces=faceLandmarker.detectForVideo(video,now).faceLandmarks;
        const face=faces?.[0];
        let hands=[];
        if(face){
          lastFaceTime=now;
          if(!faceVisible){
            faceVisible=true; status('おかお みーつけた！ みてるよ 👀','found');
            if(!helloSaid){helloSaid=true; say('みーつけた！いっしょに ぱくっ！');}
          }
          const center=face[1];
          // Preview is mirrored, so reverse horizontal input for the avatar eyes.
          look(clamp((.5-center.x)*2.3,-1,1),clamp((center.y-.48)*2.5,-1,1));
          if(handLandmarker){
            hands=handLandmarker.detectForVideo(video,now).landmarks||[];
            observeBite(face,hands,now);
          }
          drawDetection(face,hands,waitingForHandToLeave);
          detectionStatus(waitingForHandToLeave?'near':hands.length?'hand':'face',true,hands.length>0);
        } else if(now-lastFaceTime>1100){
          if(faceVisible){faceVisible=false;status('おかおを さがしてるよ 👀','busy');}
          resetGesture();look();
          drawDetection(null,[],false);
          detectionStatus('search');
        }
        frameAvgMs=frameAvgMs*.85+(performance.now()-start)*.15;
      } catch(e) {
        // Keep the camera preview usable when only face analysis fails.
        showCameraIssue('カメラ映像のAI解析',e);
        faceLandmarker=null; handLandmarker=null;
        faceVisible=false; resetGesture(); look();
        clearDetectionCanvas(); detectionStatus('error');
        status('映像は映るよ。AI解析が止まったので手動で遊んでね。','busy');
        $('cameraDescription').textContent='映像は表示中。AIを再試行するにはカメラをOFF→ON';
        return;
      }
    }
    // Invite softly, without demanding bites or assigning a score.
    if (now-lastInviteAt>39000 && now-lastActionAt>26000){
      munch(faceVisible); lastInviteAt=now;
    }
    frameId=requestAnimationFrame(()=>loop(runId));
  }
  async function startCamera(){
    if(starting||stream)return;
    cameraError.hidden=true;
    cameraError.open=false;
    resetDetection();
    detectionStatus('loading');
    if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){
      const e=new Error('getUserMedia unavailable or insecure context');
      showCameraIssue('カメラAPIの利用',e);
      status('SafariでHTTPSのページを開いてね','busy');
      showToast('カメラはSafariで直接開いてください。');
      return;
    }
    starting=true;
    const runId=++requestId;
    cameraButton.textContent='準備中…';cameraButton.disabled=true;
    status('カメラを じゅんびしてるよ…','busy');
    // Camera permission is requested first, separately from model initialization.
    try{
      let acquired;
      try{
        acquired=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480},frameRate:{ideal:20,max:30}}});
      }catch(cameraErrorOriginal){
        // A generic request can succeed when the device rejects a constraint.
        if(cameraErrorOriginal.name!=='OverconstrainedError')throw cameraErrorOriginal;
        acquired=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
      }
      if(runId!==requestId){acquired.getTracks().forEach(t=>t.stop());return;}
      stream=acquired;video.srcObject=stream;
      await video.play();
      if(runId!==requestId)return;
      preview.classList.add('visible');
      cameraButton.textContent='カメラ OFF';cameraButton.disabled=false;
      status('カメラはOK！ おめめを準備するね…','busy');
      detectionStatus('loading');
    }catch(e){
      if(runId!==requestId)return;
      stopCamera(false);
      showCameraIssue('カメラの起動または映像再生',e);
      status('カメラを使えませんでした','busy');
      showToast(cameraExplanation(e));
      return;
    }
    try{
      if(!faceLandmarker){
        const {FilesetResolver,FaceLandmarker,HandLandmarker}=await loadVisionLibrary();
        if(runId!==requestId)return;
        status('AIモデルを読み込んでいるよ…','busy');
        const vision=await FilesetResolver.forVisionTasks(`${CDN}/wasm`);
        if(runId!==requestId)return;
        faceLandmarker=await createTask(FaceLandmarker,vision,{baseOptions:{modelAssetPath:FACE_MODEL},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.55,minFacePresenceConfidence:.5,minTrackingConfidence:.5});
        if(runId!==requestId)return;
        try{
          handLandmarker=await createTask(HandLandmarker,vision,{baseOptions:{modelAssetPath:HAND_MODEL},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
        }catch(handError){
          handLandmarker=null;
          showCameraIssue('手の動き検出（顔追跡は動作中）',handError);
          showToast('顔追跡は動くよ！手の検出が使えないときは「たべたよ！」を押してね。');
        }
      }
      if(runId!==requestId)return;
      cameraButton.textContent='カメラ OFF';cameraButton.disabled=false;
      $('cameraDescription').textContent=handLandmarker?'おかおと てのうごきを みているよ':'おかおを みているよ';
      status('おかおを さがしてるよ 👀','busy');
      lastInference=0;helloSaid=false;resetGesture();
      lastInviteAt=performance.now();lastActionAt=lastInviteAt;
      frameId=requestAnimationFrame(()=>loop(runId));
    }catch(e){
      if(runId!==requestId)return;
      faceLandmarker=null;handLandmarker=null;
      showCameraIssue('AIモデルの取得・初期化',e);
      status('カメラはOK。AIの読み込みに失敗したよ','busy');
      detectionStatus('error');
      $('cameraDescription').textContent='映像は表示中。AIを再試行するにはカメラをOFF→ON';
      showToast('カメラは使えます。AIモデルの通信に失敗しました。詳細を確認してね。');
    }finally{
      if(runId===requestId)starting=false;
    }
  }
  cameraButton.addEventListener('click',()=>{if(stream) stopCamera();else startCamera();});
  $('expandPreview').addEventListener('click',()=>{
    const expanded=preview.classList.toggle('expanded');
    const button=$('expandPreview');
    button.setAttribute('aria-pressed',String(expanded));
    button.setAttribute('aria-label',expanded?'カメラ映像を縮小':'カメラ映像を拡大');
    button.textContent=expanded?'⤡':'⤢';
    clearDetectionCanvas();
  });
  $('ateButton').addEventListener('click',()=>praise('manual'));
  $('eatTogether').addEventListener('click',()=>munch(true));
  voiceButton.addEventListener('click',()=>{
    soundOn=!soundOn; voiceButton.setAttribute('aria-pressed',String(soundOn));
    voiceButton.setAttribute('aria-label',soundOn?'鳴き声をオフにする':'鳴き声をオンにする');
    voiceButton.textContent=soundOn?'🔊':'🔇';
    if(soundOn) talk('おはなし するね！');
  });
  effectsButton.addEventListener('click',()=>{
    effectsOn=!effectsOn;
    effectsButton.setAttribute('aria-pressed',String(effectsOn));
    effectsButton.setAttribute('aria-label',effectsOn?'効果音をオフにする':'効果音をオンにする');
    effectsButton.textContent=effectsOn?'🎵':'🔕';
    if(effectsOn) playEffect('enabled');
  });
  $('testSoundButton').addEventListener('click',()=>{
    if(!soundOn&&!effectsOn){showToast('🔊と🎵をオンにしてね！');return;}
    if(soundOn) void playSound('happyVoice','voice');
    if(effectsOn) void playSound('praise','effects');
  });
  $('autoPraise').addEventListener('change',()=>{resetGesture();showToast($('autoPraise').checked?'じどうで ほめるよ！':'タップしたときだけ ほめるよ！');});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(stream)stopCamera(false);}
  });
  window.addEventListener('pagehide',()=>{if(stream)stopCamera(false);});
  // Manual mode works before camera access or while offline.
  look();
})();
</script>
